<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이페이지</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #f4f4f5;
  }
  .box {
    background: #fff;
    padding: 32px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    width: 320px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 16px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 4px;
  }
  .field {
    margin-bottom: 14px;
  }
  /* 기본 상태: 읽기 전용 플레인 텍스트 (input 아님 — 클릭/포커스 자체가 불가) */
  .value {
    padding: 10px 0;
    font-size: 14px;
    color: #111;
    border-bottom: 1px solid #e5e7eb;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  #editBtn {
    background: #2563eb;
    color: #fff;
  }
  #saveBtn {
    background: #2563eb;
    color: #fff;
  }
  #cancelEditBtn {
    background: #e5e7eb;
    color: #111;
  }
  #backBtn {
    background: #e5e7eb;
    color: #111;
  }
  #deleteBtn {
    background: #fff;
    color: #dc2626;
    border: 1px solid #dc2626;
    margin-top: 8px;
  }
  #message {
    margin-top: 8px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  hr {
    border: none;
    border-top: 1px solid #e5e7eb;
    margin: 16px 0;
  }

  /* 비밀번호 확인 모달 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-box {
    background: #fff;
    padding: 24px;
    border-radius: 8px;
    width: 260px;
  }
  .modal-box p {
    font-size: 14px;
    margin: 0 0 12px;
  }
  .modal-box input {
    margin-bottom: 8px;
  }
  #modalError {
    font-size: 12px;
    color: #dc2626;
    min-height: 16px;
    margin-bottom: 8px;
  }
  #modalConfirmBtn {
    background: #2563eb;
    color: #fff;
  }
  #modalCancelBtn {
    background: #e5e7eb;
    color: #111;
  }

  /* 다른 display 규칙(.modal-overlay 등)보다 항상 이겨야 하므로 스타일시트 맨 끝에 둔다 */
  .hidden {
    display: none !important;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>마이페이지</h1>

    <div class="field">
      <label>아이디</label>
      <div class="value" id="usernameValue"></div>
    </div>
    <div class="field">
      <label>이메일</label>
      <div class="value" id="emailValue"></div>
    </div>
    <div class="field">
      <label>닉네임</label>
      <div class="value" id="nicknameValue"></div>
    </div>

    <div class="field">
      <label for="name">이름</label>
      <div class="value" id="nameValue"></div>
      <input id="nameInput" type="text" class="hidden">
    </div>
    <div class="field">
      <label for="birthDate">생년월일</label>
      <div class="value" id="birthDateValue"></div>
      <input id="birthDateInput" type="date" class="hidden">
    </div>

    <button id="editBtn">회원정보 수정</button>
    <button id="saveBtn" class="hidden">저장</button>
    <button id="cancelEditBtn" class="hidden">취소</button>
    <button id="backBtn">홈으로</button>
    <div id="message"></div>

    <hr>
    <button id="deleteBtn">회원 탈퇴</button>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="modalMessage">비밀번호를 입력해주세요.</p>
      <input id="modalPasswordInput" type="password" placeholder="비밀번호">
      <div id="modalError"></div>
      <button id="modalConfirmBtn">확인</button>
      <button id="modalCancelBtn">취소</button>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const userId = params.get('id');

  const usernameValue = document.getElementById('usernameValue');
  const emailValue = document.getElementById('emailValue');
  const nicknameValue = document.getElementById('nicknameValue');
  const nameValue = document.getElementById('nameValue');
  const birthDateValue = document.getElementById('birthDateValue');
  const nameInput = document.getElementById('nameInput');
  const birthDateInput = document.getElementById('birthDateInput');
  const editBtn = document.getElementById('editBtn');
  const saveBtn = document.getElementById('saveBtn');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  const messageEl = document.getElementById('message');

  const modalOverlay = document.getElementById('modalOverlay');
  const modalMessage = document.getElementById('modalMessage');
  const modalPasswordInput = document.getElementById('modalPasswordInput');
  const modalError = document.getElementById('modalError');
  const modalConfirmBtn = document.getElementById('modalConfirmBtn');
  const modalCancelBtn = document.getElementById('modalCancelBtn');

  function showMessage(text, isError) {
    messageEl.textContent = text;
    messageEl.style.color = isError ? '#dc2626' : '#16a34a';
  }

  // 비밀번호 확인 모달: onVerified(password) 는 검증 성공 시 호출된다.
  let modalOnVerified = null;

  function openPasswordModal(message, onVerified) {
    modalMessage.textContent = message;
    modalPasswordInput.value = '';
    modalError.textContent = '';
    modalOnVerified = onVerified;
    modalOverlay.classList.remove('hidden');
    modalPasswordInput.focus();
  }

  function closePasswordModal() {
    modalOverlay.classList.add('hidden');
    modalOnVerified = null;
  }

  async function confirmPasswordModal() {
    if (!userId) {
      modalError.textContent = '로그인 정보가 없습니다.';
      return;
    }
    const password = modalPasswordInput.value;
    try {
      const res = await fetch(`/users/${encodeURIComponent(userId)}/verify-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (res.ok) {
        const callback = modalOnVerified;
        closePasswordModal();
        if (callback) callback();
      } else {
        const data = await res.json().catch(() => ({}));
        modalError.textContent = data.detail || '비밀번호가 올바르지 않습니다.';
      }
    } catch (e) {
      modalError.textContent = '서버에 연결할 수 없습니다.';
    }
  }

  modalConfirmBtn.addEventListener('click', confirmPasswordModal);
  modalCancelBtn.addEventListener('click', closePasswordModal);

  async function loadProfile() {
    if (!userId) {
      showMessage('로그인 정보가 없습니다. 다시 로그인해주세요.', true);
      return;
    }
    try {
      const res = await fetch(`/users/${encodeURIComponent(userId)}`);
      if (!res.ok) {
        showMessage('사용자 정보를 불러오지 못했습니다.', true);
        return;
      }
      const data = await res.json();
      usernameValue.textContent = data.username;
      emailValue.textContent = data.email;
      nicknameValue.textContent = data.nickname;
      nameValue.textContent = data.name;
      birthDateValue.textContent = data.birth_date;
      nameInput.value = data.name;
      birthDateInput.value = data.birth_date;
    } catch (e) {
      showMessage('서버에 연결할 수 없습니다.', true);
    }
  }

  function enterEditMode() {
    nameValue.classList.add('hidden');
    birthDateValue.classList.add('hidden');
    nameInput.classList.remove('hidden');
    birthDateInput.classList.remove('hidden');
    editBtn.classList.add('hidden');
    saveBtn.classList.remove('hidden');
    cancelEditBtn.classList.remove('hidden');
  }

  function exitEditMode() {
    nameValue.classList.remove('hidden');
    birthDateValue.classList.remove('hidden');
    nameInput.classList.add('hidden');
    birthDateInput.classList.add('hidden');
    editBtn.classList.remove('hidden');
    saveBtn.classList.add('hidden');
    cancelEditBtn.classList.add('hidden');
  }

  editBtn.addEventListener('click', () => {
    openPasswordModal('본인 확인을 위해 비밀번호를 입력해주세요.', enterEditMode);
  });

  cancelEditBtn.addEventListener('click', () => {
    // 저장하지 않은 수정 내용은 버리고 원래 값으로 되돌린다.
    nameInput.value = nameValue.textContent;
    birthDateInput.value = birthDateValue.textContent;
    exitEditMode();
  });

  async function saveProfile() {
    try {
      const res = await fetch(`/users/${encodeURIComponent(userId)}/profile`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: nameInput.value, birth_date: birthDateInput.value }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        nameValue.textContent = data.name;
        birthDateValue.textContent = data.birth_date;
        exitEditMode();
        showMessage('저장되었습니다.', false);
      } else {
        const detail = Array.isArray(data.detail) ? data.detail[0]?.msg : data.detail;
        showMessage(detail || '저장에 실패했습니다.', true);
      }
    } catch (e) {
      showMessage('서버에 연결할 수 없습니다.', true);
    }
  }

  saveBtn.addEventListener('click', saveProfile);

  async function performDelete() {
    try {
      const res = await fetch(`/users/${encodeURIComponent(userId)}`, { method: 'DELETE' });
      if (res.status === 204) {
        alert('탈퇴가 완료되었습니다.');
        window.location.href = '/main';
      } else {
        showMessage('탈퇴에 실패했습니다.', true);
      }
    } catch (e) {
      showMessage('서버에 연결할 수 없습니다.', true);
    }
  }

  deleteBtn.addEventListener('click', () => {
    if (!userId) {
      showMessage('로그인 정보가 없습니다. 다시 로그인해주세요.', true);
      return;
    }
    // 1차 확인 팝업
    if (!window.confirm('탈퇴하시겠습니까?')) {
      return;
    }
    // 2차: 비밀번호 재확인 후 실제 탈퇴
    openPasswordModal('탈퇴하려면 비밀번호를 입력해주세요.', performDelete);
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = `/home?id=${encodeURIComponent(userId || '')}`;
  });

  loadProfile();
</script>
</body>
</html>
