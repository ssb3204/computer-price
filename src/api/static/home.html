<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f4f4f5;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
  }
  .logo {
    font-weight: 700;
    font-size: 16px;
    color: #111;
  }
  .user-menu {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  .user-menu .nickname {
    color: #111;
    font-weight: 600;
  }
  .user-menu a,
  .user-menu button {
    background: none;
    border: none;
    color: #2563eb;
    cursor: pointer;
    font-size: 14px;
    padding: 0;
    text-decoration: none;
  }

  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  nav.sidebar {
    width: 220px;
    flex: 0 0 auto;
    background: #fff;
    border-right: 1px solid #e5e7eb;
    padding: 16px 0;
  }
  .side-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 20px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 14px;
    color: #374151;
    text-decoration: none;
  }
  .side-item.active {
    background: #eff6ff;
    color: #2563eb;
    font-weight: 600;
    border-right: 3px solid #2563eb;
  }

  main {
    flex: 1;
    min-width: 0;
    padding: 24px;
    overflow-y: auto;
  }
  .placeholder {
    color: #9ca3af;
    font-size: 14px;
    text-align: center;
    margin-top: 80px;
  }

  .cat-filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .cat-btn {
    padding: 6px 14px;
    border: 1px solid #d1d5db;
    border-radius: 999px;
    background: #fff;
    color: #374151;
    font-size: 13px;
    cursor: pointer;
  }
  .cat-btn.active {
    background: #2563eb;
    border-color: #2563eb;
    color: #fff;
  }

  .card {
    background: #fff;
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    margin-bottom: 20px;
  }

  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
  }
  .item-row:last-child {
    border-bottom: none;
  }
  .item-row.selected {
    background: #eff6ff;
  }
  .item-name {
    font-size: 14px;
    color: #111;
  }
  .item-meta {
    font-size: 12px;
    color: #9ca3af;
  }

  .empty {
    color: #9ca3af;
    font-size: 13px;
    padding: 8px 0;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .chart-title {
    font-size: 15px;
    font-weight: 600;
  }
  .chart-latest {
    font-size: 18px;
    font-weight: 700;
    color: #2563eb;
  }
  .chart-sub {
    font-size: 12px;
    color: #9ca3af;
  }

  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .search-row select,
  .search-row input[type="text"] {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  .search-row input[type="text"] {
    flex: 1;
    min-width: 140px;
  }
  .search-row button {
    padding: 10px 16px;
    border: none;
    border-radius: 4px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  .result-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .result-item:last-child {
    border-bottom: none;
  }
  .result-item input[type="checkbox"] {
    margin-top: 4px;
  }
  .result-name {
    font-size: 14px;
    color: #111;
  }
  .result-pcode {
    font-size: 12px;
    color: #9ca3af;
  }
  .loading {
    font-size: 13px;
    color: #6b7280;
    padding: 8px 0;
  }
  .wl-action-btn {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  #wlLoadMoreBtn {
    background: #e5e7eb;
    color: #111;
  }
  #wlAddSelectedBtn {
    background: #2563eb;
    color: #fff;
  }
  #wlAddSelectedBtn:disabled {
    background: #93c5fd;
    cursor: not-allowed;
  }
  #wlMessage {
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    margin-top: 4px;
  }
  .delete-btn {
    background: #fff;
    color: #dc2626;
    border: 1px solid #dc2626;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  .hidden {
    display: none !important;
  }

  footer {
    text-align: center;
    padding: 16px;
    font-size: 12px;
    color: #9ca3af;
    border-top: 1px solid #e5e7eb;
    background: #fff;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">컴퓨터 가격 모니터링</div>
    <div class="user-menu">
      <span class="nickname" id="nickname"></span>
      <a id="mypageLink" href="/mypage">마이페이지</a>
      <button id="logoutBtn" type="button">로그아웃</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <button class="side-item" id="priceTrendNav" type="button">컴퓨터 가격 추이</button>
      <button class="side-item" id="buildsNav" type="button">부품 조합</button>
      <button class="side-item" id="watchlistNav" type="button">크롤링 대상 관리</button>
    </nav>

    <main id="mainContent">
      <div class="placeholder">왼쪽 메뉴에서 항목을 선택하세요.</div>
    </main>
  </div>

  <footer>&copy; 2026 computer_price</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const userId = params.get('id');
  const username = params.get('username');
  const nickname = params.get('nickname');

  if (nickname) {
    document.getElementById('nickname').textContent = `${nickname}님`;
  }
  if (userId) {
    document.getElementById('mypageLink').href = `/mypage?id=${encodeURIComponent(userId)}`;
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    window.location.href = '/main';
  });

  const mainContent = document.getElementById('mainContent');

  function setActiveNav(navId) {
    document.querySelectorAll('.side-item').forEach((el) => el.classList.remove('active'));
    const el = document.getElementById(navId);
    if (el) el.classList.add('active');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text ?? '';
    return div.innerHTML;
  }

  const CATEGORIES = ['전체', 'CPU', 'GPU', 'RAM', 'SSD'];

  let watchlist = [];
  let activeCategory = '전체';
  let selectedWatchlistId = null;

  async function openPriceTrend() {
    setActiveNav('priceTrendNav');
    mainContent.innerHTML = '<div class="placeholder">불러오는 중...</div>';

    if (!userId) {
      mainContent.innerHTML = '<div class="placeholder">로그인 정보가 없습니다. 다시 로그인해주세요.</div>';
      return;
    }

    try {
      const res = await fetch(`/users/${encodeURIComponent(userId)}/watchlist`);
      watchlist = res.ok ? await res.json() : [];
    } catch (e) {
      watchlist = [];
    }

    renderPriceTrendView();
  }

  function renderPriceTrendView() {
    mainContent.innerHTML = `
      <div class="cat-filters" id="catFilters"></div>
      <div class="card">
        <div id="itemList"></div>
      </div>
      <div class="card" id="chartCard" style="display:none;">
        <div class="chart-header">
          <div>
            <div class="chart-title" id="chartTitle"></div>
            <div class="chart-sub" id="chartSub"></div>
          </div>
          <div class="chart-latest" id="chartLatest"></div>
        </div>
        <div id="chartArea"></div>
      </div>
    `;

    const catFilters = document.getElementById('catFilters');
    CATEGORIES.forEach((cat) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cat-btn' + (cat === activeCategory ? ' active' : '');
      btn.textContent = cat;
      btn.addEventListener('click', () => {
        activeCategory = cat;
        renderPriceTrendView();
      });
      catFilters.appendChild(btn);
    });

    renderItemList();
  }

  function renderItemList() {
    const itemList = document.getElementById('itemList');
    const filtered = activeCategory === '전체'
      ? watchlist
      : watchlist.filter((item) => item.category === activeCategory);

    if (filtered.length === 0) {
      itemList.innerHTML = '<div class="empty">담아둔 크롤링 대상이 없습니다. "크롤링 대상 관리"에서 먼저 담아주세요.</div>';
      return;
    }

    itemList.innerHTML = '';
    filtered.forEach((item) => {
      const row = document.createElement('div');
      row.className = 'item-row' + (item.watchlist_id === selectedWatchlistId ? ' selected' : '');
      row.innerHTML = `
        <div>
          <div class="item-name">${escapeHtml(item.product_name || item.pcode)}</div>
          <div class="item-meta">${escapeHtml(item.site)} · ${escapeHtml(item.category)}</div>
        </div>
      `;
      row.addEventListener('click', () => selectItem(item));
      itemList.appendChild(row);
    });
  }

  async function selectItem(item) {
    selectedWatchlistId = item.watchlist_id;
    renderItemList();

    const chartCard = document.getElementById('chartCard');
    chartCard.style.display = 'block';
    document.getElementById('chartTitle').textContent = item.product_name || item.pcode;
    document.getElementById('chartSub').textContent = `${item.site} · ${item.category}`;
    document.getElementById('chartLatest').textContent = '';
    document.getElementById('chartArea').innerHTML = '<div class="placeholder">불러오는 중...</div>';

    try {
      const res = await fetch(`/users/${encodeURIComponent(userId)}/watchlist/${item.watchlist_id}/price-history`);
      const points = res.ok ? await res.json() : [];
      renderChart(points);
    } catch (e) {
      document.getElementById('chartArea').innerHTML = '<div class="placeholder">가격 이력을 불러오지 못했습니다.</div>';
    }
  }

  function formatPrice(price) {
    return price.toLocaleString('ko-KR') + '원';
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  function renderChart(points) {
    const chartArea = document.getElementById('chartArea');
    if (points.length === 0) {
      chartArea.innerHTML = '<div class="placeholder">아직 수집된 가격 데이터가 없습니다. 다음 크롤링을 기다려주세요.</div>';
      return;
    }

    const latest = points[points.length - 1];
    document.getElementById('chartLatest').textContent = formatPrice(latest.price);

    if (points.length === 1) {
      chartArea.innerHTML = `<div class="placeholder">가격 데이터가 1건뿐이라 추이 그래프는 데이터가 더 쌓이면 표시됩니다.</div>`;
      return;
    }

    const width = 640;
    const height = 220;
    const padding = 36;

    const prices = points.map((p) => p.price);
    const minPrice = Math.min(...prices);
    const maxPrice = Math.max(...prices);
    const range = maxPrice - minPrice || 1;

    const stepX = (width - padding * 2) / (points.length - 1);
    const coords = points.map((p, i) => {
      const x = padding + i * stepX;
      const y = padding + (height - padding * 2) * (1 - (p.price - minPrice) / range);
      return [x, y];
    });

    const polyline = coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const dots = coords.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#2563eb" />`).join('');

    const svg = `
      <svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px;">
        <text x="${padding}" y="16" font-size="11" fill="#9ca3af">${formatPrice(maxPrice)}</text>
        <text x="${padding}" y="${height - 6}" font-size="11" fill="#9ca3af">${formatPrice(minPrice)}</text>
        <polyline points="${polyline}" fill="none" stroke="#2563eb" stroke-width="2" />
        ${dots}
        <text x="${coords[0][0]}" y="${height - padding + 20}" font-size="11" fill="#9ca3af">${formatDate(points[0].crawled_at)}</text>
        <text x="${coords[coords.length - 1][0]}" y="${height - padding + 20}" font-size="11" fill="#9ca3af" text-anchor="end">${formatDate(points[points.length - 1].crawled_at)}</text>
      </svg>
    `;
    chartArea.innerHTML = svg;
  }

  // ── 크롤링 대상 관리 (검색 → 담기 → 내 목록) ──
  // 패널을 열 때마다 DOM을 새로 그리므로, 엘리먼트 참조와 상태도 매번 이 함수 안에서 새로 만든다.
  function openWatchlistManage() {
    setActiveNav('watchlistNav');
    mainContent.innerHTML = `
      <div class="card">
        <h2 style="font-size:16px;margin:0 0 12px;">상품 검색</h2>
        <div class="search-row">
          <select id="wlSiteSelect">
            <option value="다나와">다나와</option>
            <option value="컴퓨존">컴퓨존</option>
            <option value="견적왕">견적왕</option>
          </select>
          <select id="wlCategorySelect">
            <option value="CPU">CPU</option>
            <option value="GPU" selected>GPU</option>
            <option value="RAM">RAM</option>
            <option value="SSD">SSD</option>
          </select>
          <input id="wlQueryInput" type="text" placeholder="검색어 입력 (예: RTX 5070)">
          <button id="wlSearchBtn" type="button">검색</button>
        </div>
        <div id="wlSearchResults"></div>
        <button id="wlLoadMoreBtn" class="wl-action-btn hidden" type="button">더 보기</button>
        <button id="wlAddSelectedBtn" class="wl-action-btn" disabled>선택 완료 (0개)</button>
        <div id="wlMessage"></div>
      </div>
      <div class="card">
        <h2 style="font-size:16px;margin:0 0 12px;">내 크롤링 대상</h2>
        <div id="wlMyWatchlist"><div class="loading">불러오는 중...</div></div>
      </div>
    `;

    if (!userId) {
      mainContent.innerHTML = '<div class="placeholder">로그인 정보가 없습니다. 다시 로그인해주세요.</div>';
      return;
    }

    const siteSelect = document.getElementById('wlSiteSelect');
    const categorySelect = document.getElementById('wlCategorySelect');
    const queryInput = document.getElementById('wlQueryInput');
    const searchBtn = document.getElementById('wlSearchBtn');
    const searchResults = document.getElementById('wlSearchResults');
    const loadMoreBtn = document.getElementById('wlLoadMoreBtn');
    const addSelectedBtn = document.getElementById('wlAddSelectedBtn');
    const messageEl = document.getElementById('wlMessage');
    const myWatchlistEl = document.getElementById('wlMyWatchlist');

    const PAGE_SIZE = 10;
    let currentMaxResults = PAGE_SIZE;
    let lastResults = [];
    const selectedIndexes = new Set();

    function showMessage(text, isError) {
      messageEl.textContent = text;
      messageEl.style.color = isError ? '#dc2626' : '#16a34a';
    }

    function updateAddButton() {
      addSelectedBtn.disabled = selectedIndexes.size === 0;
      addSelectedBtn.textContent = `선택 완료 (${selectedIndexes.size}개)`;
    }

    function doSearch() {
      const query = queryInput.value.trim();
      if (!query) {
        showMessage('검색어를 입력해주세요.', true);
        return;
      }
      currentMaxResults = PAGE_SIZE;
      selectedIndexes.clear();
      updateAddButton();
      fetchResults(false);
    }

    function loadMore() {
      const previousCount = lastResults.length;
      currentMaxResults += PAGE_SIZE;
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = '불러오는 중...';
      fetchResults(true, previousCount);
    }

    function resetLoadMoreBtn() {
      loadMoreBtn.disabled = false;
      loadMoreBtn.textContent = '더 보기';
    }

    async function fetchResults(isLoadMore, previousCount = 0) {
      if (!isLoadMore) {
        searchResults.innerHTML = '<div class="loading">검색 중... (사이트에 직접 요청하므로 몇 초 걸릴 수 있습니다)</div>';
        loadMoreBtn.classList.add('hidden');
      }

      const query = queryInput.value.trim();
      const site = siteSelect.value;
      const category = categorySelect.value;
      const url = `/crawl/search?site=${encodeURIComponent(site)}&query=${encodeURIComponent(query)}&category=${encodeURIComponent(category)}&max_results=${currentMaxResults}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) {
          if (!isLoadMore) searchResults.innerHTML = '';
          showMessage(data.detail || '검색에 실패했습니다.', true);
          resetLoadMoreBtn();
          loadMoreBtn.classList.add('hidden');
          return;
        }
        if (data.length === 0) {
          if (!isLoadMore) searchResults.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
          resetLoadMoreBtn();
          loadMoreBtn.classList.add('hidden');
          return;
        }

        lastResults = data.map((r) => ({ ...r, site, category }));
        if (isLoadMore) {
          appendResults(previousCount);
        } else {
          renderResults();
        }

        resetLoadMoreBtn();
        if (data.length >= currentMaxResults) {
          loadMoreBtn.classList.remove('hidden');
        } else {
          loadMoreBtn.classList.add('hidden');
        }
      } catch (e) {
        if (!isLoadMore) searchResults.innerHTML = '';
        showMessage('서버에 연결할 수 없습니다.', true);
        resetLoadMoreBtn();
        loadMoreBtn.classList.add('hidden');
      }
    }

    function buildResultRow(item, i) {
      const row = document.createElement('div');
      row.className = 'result-item';
      row.innerHTML = `
        <input type="checkbox" id="wl-chk-${i}">
        <div>
          <div class="result-name">${escapeHtml(item.product_name)}</div>
          <div class="result-pcode">${escapeHtml(item.pcode)}</div>
        </div>
      `;
      const checkbox = row.querySelector('input');
      checkbox.checked = selectedIndexes.has(i);
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          selectedIndexes.add(i);
        } else {
          selectedIndexes.delete(i);
        }
        updateAddButton();
      });
      return row;
    }

    function renderResults() {
      searchResults.innerHTML = '';
      lastResults.forEach((item, i) => searchResults.appendChild(buildResultRow(item, i)));
    }

    function appendResults(fromIndex) {
      for (let i = fromIndex; i < lastResults.length; i++) {
        searchResults.appendChild(buildResultRow(lastResults[i], i));
      }
    }

    async function addSelected() {
      const items = Array.from(selectedIndexes).map((i) => {
        const r = lastResults[i];
        return {
          site: r.site,
          query: queryInput.value.trim(),
          pcode: r.pcode,
          product_name: r.product_name,
          category: r.category,
          brand: null,
        };
      });

      addSelectedBtn.disabled = true;
      try {
        const res = await fetch(`/users/${encodeURIComponent(userId)}/watchlist`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 201) {
          showMessage(`${items.length}개 추가되었습니다.`, false);
          searchResults.innerHTML = '';
          loadMoreBtn.classList.add('hidden');
          currentMaxResults = PAGE_SIZE;
          lastResults = [];
          selectedIndexes.clear();
          updateAddButton();
          loadMyWatchlistPanel();
        } else {
          showMessage(data.detail || '추가에 실패했습니다.', true);
          updateAddButton();
        }
      } catch (e) {
        showMessage('서버에 연결할 수 없습니다.', true);
        updateAddButton();
      }
    }

    async function loadMyWatchlistPanel() {
      try {
        const res = await fetch(`/users/${encodeURIComponent(userId)}/watchlist`);
        const data = await res.json();
        if (!res.ok) {
          myWatchlistEl.innerHTML = '<div class="empty">불러오지 못했습니다.</div>';
          return;
        }
        if (data.length === 0) {
          myWatchlistEl.innerHTML = '<div class="empty">아직 담은 상품이 없습니다.</div>';
          return;
        }
        myWatchlistEl.innerHTML = '';
        data.forEach((item) => {
          const row = document.createElement('div');
          row.className = 'item-row';
          row.innerHTML = `
            <div>
              <div class="item-name">${escapeHtml(item.product_name || item.pcode)}</div>
              <div class="item-meta">${escapeHtml(item.site)} · ${escapeHtml(item.category)}</div>
            </div>
          `;
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'delete-btn';
          delBtn.textContent = '빼기';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            removeItem(item.watchlist_id);
          });
          row.appendChild(delBtn);
          myWatchlistEl.appendChild(row);
        });
      } catch (e) {
        myWatchlistEl.innerHTML = '<div class="empty">서버에 연결할 수 없습니다.</div>';
      }
    }

    async function removeItem(watchlistId) {
      try {
        const res = await fetch(`/users/${encodeURIComponent(userId)}/watchlist/${watchlistId}`, {
          method: 'DELETE',
        });
        if (res.status === 204) {
          loadMyWatchlistPanel();
        } else {
          showMessage('삭제에 실패했습니다.', true);
        }
      } catch (e) {
        showMessage('서버에 연결할 수 없습니다.', true);
      }
    }

    searchBtn.addEventListener('click', doSearch);
    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doSearch();
    });
    loadMoreBtn.addEventListener('click', loadMore);
    addSelectedBtn.addEventListener('click', addSelected);

    loadMyWatchlistPanel();
  }

  document.getElementById('priceTrendNav').addEventListener('click', openPriceTrend);
  document.getElementById('watchlistNav').addEventListener('click', openWatchlistManage);
  // ── 부품 조합 (공개 게시물) ──
  // 조합은 누구나 볼 수 있고 수정은 작성자만 가능하다. 그래서 목록/상세는 그대로
  // 보여주되, 편집 UI(부품 추가·빼기, 삭제)는 내 조합일 때만 렌더링한다.

  let selectedBuildId = null;
  let buildTrendDays = 30;

  async function openBuilds() {
    setActiveNav('buildsNav');
    selectedBuildId = null;
    mainContent.innerHTML = `
      <div class="card">
        <h2 style="font-size:16px;margin:0 0 4px;">조합 둘러보기</h2>
        <div class="item-meta" style="margin-bottom:12px;">
          모든 사용자의 조합을 볼 수 있습니다. 수정은 만든 사람만 가능합니다.
        </div>
        <div id="buildList"><div class="placeholder">불러오는 중...</div></div>
        <div class="search-row" style="margin-top:12px;">
          <input id="newBuildName" type="text" placeholder="새 조합 이름 (예: 게이밍용)" maxlength="100">
          <button id="createBuildBtn" type="button">만들기</button>
        </div>
        <div id="buildMessage" class="item-meta"></div>
      </div>
      <div id="buildDetail"></div>
    `;
    document.getElementById('createBuildBtn').addEventListener('click', createBuild);
    document.getElementById('newBuildName').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') createBuild();
    });
    loadBuildList();
  }

  function setBuildMessage(text, isError) {
    const el = document.getElementById('buildMessage');
    if (!el) return;
    el.textContent = text || '';
    el.style.color = isError ? '#dc2626' : '#16a34a';
  }

  async function loadBuildList() {
    const listEl = document.getElementById('buildList');
    try {
      const res = await fetch('/builds?limit=50');
      if (!res.ok) throw new Error();
      renderBuildList(await res.json());
    } catch {
      listEl.innerHTML = '<div class="placeholder">조합을 불러오지 못했습니다.</div>';
    }
  }

  function renderBuildList(builds) {
    const listEl = document.getElementById('buildList');
    if (builds.length === 0) {
      listEl.innerHTML = '<div class="empty">아직 만들어진 조합이 없습니다.</div>';
      return;
    }
    listEl.innerHTML = '';
    builds.forEach((b) => {
      const mine = userId && String(b.author_id) === String(userId);
      const row = document.createElement('div');
      row.className = 'item-row' + (b.build_id === selectedBuildId ? ' selected' : '');
      row.innerHTML = `
        <div>
          <div class="item-name">${escapeHtml(b.name)}${mine ? ' <span style="font-size:11px;color:#1d4ed8;">· 내 조합</span>' : ''}</div>
          <div class="item-meta">${escapeHtml(b.author)} · 부품 ${b.item_count}개</div>
        </div>
      `;
      if (mine) {
        const del = document.createElement('button');
        del.type = 'button';
        del.textContent = '삭제';
        del.style.cssText = 'background:none;border:none;color:#dc2626;cursor:pointer;';
        del.addEventListener('click', (e) => { e.stopPropagation(); deleteBuild(b.build_id, b.name); });
        row.appendChild(del);
      }
      row.addEventListener('click', () => selectBuild(b.build_id));
      listEl.appendChild(row);
    });
  }

  async function createBuild() {
    if (!userId) return setBuildMessage('로그인 정보가 없습니다.', true);
    const input = document.getElementById('newBuildName');
    const name = input.value.trim();
    if (!name) return setBuildMessage('조합 이름을 입력해주세요.', true);

    const res = await fetch(`/users/${encodeURIComponent(userId)}/builds`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    if (res.status === 409) return setBuildMessage('같은 이름의 조합이 이미 있습니다.', true);
    if (!res.ok) return setBuildMessage('조합을 만들지 못했습니다.', true);

    const build = await res.json();
    input.value = '';
    setBuildMessage('조합을 만들었습니다.', false);
    await loadBuildList();
    selectBuild(build.build_id);
  }

  async function deleteBuild(buildId, name) {
    if (!confirm(`'${name}' 조합을 삭제할까요?`)) return;
    const res = await fetch(`/users/${encodeURIComponent(userId)}/builds/${buildId}`, { method: 'DELETE' });
    if (!res.ok) return setBuildMessage('삭제하지 못했습니다.', true);
    if (selectedBuildId === buildId) {
      selectedBuildId = null;
      document.getElementById('buildDetail').innerHTML = '';
    }
    setBuildMessage('삭제했습니다.', false);
    loadBuildList();
  }

  async function selectBuild(buildId) {
    selectedBuildId = buildId;
    const detailEl = document.getElementById('buildDetail');
    detailEl.innerHTML = '<div class="card"><div class="placeholder">불러오는 중...</div></div>';

    const res = await fetch(`/builds/${buildId}`);
    if (!res.ok) {
      detailEl.innerHTML = '<div class="card"><div class="placeholder">조합을 불러오지 못했습니다.</div></div>';
      return;
    }
    const detail = await res.json();
    const mine = userId && String(detail.build.author_id) === String(userId);

    detailEl.innerHTML = `
      <div class="card">
        <div class="chart-header">
          <div>
            <div class="chart-title">${escapeHtml(detail.build.name)}</div>
            <div class="chart-sub">${escapeHtml(detail.build.author)} · 부품 ${detail.build.item_count}개</div>
          </div>
          <div class="chart-latest" id="buildTotal"></div>
        </div>
        <div class="cat-filters" id="buildRangeFilters"></div>
        <div id="buildChartArea"></div>
      </div>
      <div class="card">
        <h2 style="font-size:16px;margin:0 0 12px;">구성 부품</h2>
        <div id="buildParts"></div>
        ${mine ? `
          <div class="search-row" style="margin-top:12px;">
            <select id="buildWatchSelect"></select>
            <button id="addPartBtn" type="button">추가</button>
          </div>
          <div id="buildPartMessage" class="item-meta"></div>` : ''}
      </div>
    `;

    renderBuildRangeFilters();
    renderBuildParts(detail.items, mine);
    if (mine) {
      loadBuildWatchOptions(detail.items);
      document.getElementById('addPartBtn').addEventListener('click', addBuildPart);
    }
    loadBuildTrend();
    highlightSelectedBuild();
  }

  function highlightSelectedBuild() {
    document.querySelectorAll('#buildList .item-row').forEach((el, i) => {
      el.classList.remove('selected');
    });
  }

  const BUILD_RANGES = [['1주', 7], ['1달', 30], ['3달', 90], ['전체', null]];

  function renderBuildRangeFilters() {
    const el = document.getElementById('buildRangeFilters');
    el.innerHTML = '';
    BUILD_RANGES.forEach(([label, days]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cat-btn' + (days === buildTrendDays ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', () => {
        buildTrendDays = days;
        renderBuildRangeFilters();
        loadBuildTrend();
      });
      el.appendChild(btn);
    });
  }

  function renderBuildParts(items, mine) {
    const el = document.getElementById('buildParts');
    if (items.length === 0) {
      el.innerHTML = '<div class="empty">아직 부품이 없습니다.</div>';
      return;
    }
    el.innerHTML = '';
    items.forEach((it) => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div>
          <div class="item-name">${escapeHtml(it.product_name || it.pcode)}</div>
          <div class="item-meta">${escapeHtml(it.site)} · ${escapeHtml(it.category)}</div>
        </div>
      `;
      if (mine) {
        const del = document.createElement('button');
        del.type = 'button';
        del.textContent = '빼기';
        del.style.cssText = 'background:none;border:none;color:#dc2626;cursor:pointer;';
        del.addEventListener('click', () => removeBuildPart(it.watchlist_id));
        row.appendChild(del);
      }
      el.appendChild(row);
    });
  }

  function loadBuildWatchOptions(currentItems) {
    const select = document.getElementById('buildWatchSelect');
    const addBtn = document.getElementById('addPartBtn');
    if (!select || !addBtn) return;

    const already = new Set(currentItems.map((i) => i.watchlist_id));
    const available = watchlist.filter((w) => !already.has(w.watchlist_id));

    select.innerHTML = '';
    if (available.length === 0) {
      select.innerHTML = '<option value="">추가할 수 있는 상품이 없습니다</option>';
      addBtn.disabled = true;
      return;
    }
    addBtn.disabled = false;
    available.forEach((w) => {
      const opt = document.createElement('option');
      opt.value = w.watchlist_id;
      opt.textContent = `[${w.category}] ${w.product_name || w.pcode} (${w.site})`;
      select.appendChild(opt);
    });
  }

  function setPartMessage(text, isError) {
    const el = document.getElementById('buildPartMessage');
    if (!el) return;
    el.textContent = text || '';
    el.style.color = isError ? '#dc2626' : '#16a34a';
  }

  async function addBuildPart() {
    const select = document.getElementById('buildWatchSelect');
    if (!select || !select.value) return;
    const res = await fetch(`/users/${encodeURIComponent(userId)}/builds/${selectedBuildId}/items`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ watchlist_id: Number(select.value) }),
    });
    if (!res.ok) return setPartMessage('부품을 추가하지 못했습니다.', true);
    await selectBuild(selectedBuildId);
    loadBuildList();
  }

  async function removeBuildPart(watchlistId) {
    const res = await fetch(
      `/users/${encodeURIComponent(userId)}/builds/${selectedBuildId}/items/${watchlistId}`,
      { method: 'DELETE' }
    );
    if (!res.ok) return setPartMessage('부품을 빼지 못했습니다.', true);
    await selectBuild(selectedBuildId);
    loadBuildList();
  }

  async function loadBuildTrend() {
    const q = buildTrendDays ? `?days=${buildTrendDays}` : '';
    const res = await fetch(`/builds/${selectedBuildId}/price-trend${q}`);
    if (!res.ok) return;
    renderBuildChart(await res.json());
  }

  // 가격 추이 화면의 renderChart 와 같은 방식(inline SVG)으로 그린다.
  // 입력이 {date, total} 이라 축 라벨만 다르고 규격(640x220, padding 36)은 동일하다.
  function renderBuildChart(trend) {
    const chartArea = document.getElementById('buildChartArea');
    const totalEl = document.getElementById('buildTotal');
    if (!chartArea) return;

    const points = trend.points;
    if (points.length === 0) {
      totalEl.textContent = '';
      chartArea.innerHTML = `<div class="placeholder">${escapeHtml(trend.unavailable_reason || '표시할 데이터가 없습니다.')}</div>`;
      return;
    }

    const latest = points[points.length - 1];
    totalEl.textContent = formatPrice(latest.total);

    if (points.length === 1) {
      chartArea.innerHTML = '<div class="placeholder">가격 데이터가 1건뿐이라 추이 그래프는 데이터가 더 쌓이면 표시됩니다.</div>';
      return;
    }

    const width = 640;
    const height = 220;
    const padding = 36;

    const totals = points.map((p) => p.total);
    const minTotal = Math.min(...totals);
    const maxTotal = Math.max(...totals);
    const range = maxTotal - minTotal || 1;

    const stepX = (width - padding * 2) / (points.length - 1);
    const coords = points.map((p, i) => {
      const x = padding + i * stepX;
      const y = padding + (height - padding * 2) * (1 - (p.total - minTotal) / range);
      return [x, y];
    });

    const polyline = coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const dots = coords
      .map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#2563eb" />`)
      .join('');
    const shortDate = (iso) => `${Number(iso.slice(5, 7))}/${Number(iso.slice(8, 10))}`;

    chartArea.innerHTML = `
      <svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px;">
        <text x="${padding}" y="16" font-size="11" fill="#9ca3af">${formatPrice(maxTotal)}</text>
        <text x="${padding}" y="${height - 6}" font-size="11" fill="#9ca3af">${formatPrice(minTotal)}</text>
        <polyline points="${polyline}" fill="none" stroke="#2563eb" stroke-width="2" />
        ${dots}
        <text x="${coords[0][0]}" y="${height - padding + 20}" font-size="11" fill="#9ca3af">${shortDate(points[0].date)}</text>
        <text x="${coords[coords.length - 1][0]}" y="${height - padding + 20}" font-size="11" fill="#9ca3af" text-anchor="end">${shortDate(latest.date)}</text>
      </svg>
    `;
  }

  document.getElementById('buildsNav').addEventListener('click', openBuilds);
</script>
</body>
</html>
