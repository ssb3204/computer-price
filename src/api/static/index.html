<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f4f4f5;
  }
  .box {
    background: #fff;
    padding: 32px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    width: 280px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  #loginBtn {
    background: #2563eb;
    color: #fff;
  }
  #signupBtn {
    background: #e5e7eb;
    color: #111;
  }
  #message {
    margin-top: 8px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
</style>
</head>
<body>
  <div class="box">
    <input id="username" type="text" placeholder="아이디" autocomplete="username">
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="loginBtn">로그인</button>
    <button id="signupBtn">회원가입</button>
    <div id="message"></div>
  </div>

<script>
  const usernameEl = document.getElementById('username');
  const passwordEl = document.getElementById('password');
  const messageEl = document.getElementById('message');

  function showMessage(text, isError) {
    messageEl.textContent = text;
    messageEl.style.color = isError ? '#dc2626' : '#16a34a';
  }

  async function postJson(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  async function login() {
    const username = usernameEl.value;
    const password = passwordEl.value;
    try {
      const { ok, data } = await postJson('/users/login', { username, password });
      if (ok) {
        const params = new URLSearchParams({
          id: data.id,
          username: data.username,
          nickname: data.nickname,
        });
        window.location.href = `/home?${params.toString()}`;
      } else {
        showMessage(data.detail || '로그인 실패', true);
      }
    } catch (e) {
      showMessage('서버에 연결할 수 없습니다.', true);
    }
  }

  function goToSignup() {
    window.location.href = '/signup';
  }

  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('signupBtn').addEventListener('click', goToSignup);
</script>
</body>
</html>
