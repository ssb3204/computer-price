name: CI 테스트

# - 린트: ruff 로 코드 스타일/오류 정적 검사
# - 유닛 테스트: get_connection 을 mock 으로 교체해 실제 DB 없이 실행
# - 통합 테스트: 러너 안에 MySQL 8.0 service 컨테이너를 띄우고 mysql/ddl/ 을
#   부어넣어 raw_ → stg_ → ans_ 계층 로직을 검증한다.
#   운영 DB(Oracle Cloud VM)는 건드리지 않는다 — 컨테이너는 잡 종료와 함께 사라진다.

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  lint:
    name: 린트 (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 의존성 설치
        run: pip install -e ".[dev]"
      - name: ruff 검사
        run: python -m ruff check .

  unit-tests:
    name: 유닛 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 의존성 설치
        run: pip install -e ".[dev]"
      - name: 유닛 테스트 실행
        run: python -m pytest tests/unit/ -v -o "addopts="

  integration-tests:
    name: 통합 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 러너 안에서만 살아있는 일회용 MySQL. 아래 자격증명은 이 컨테이너 전용으로
    # 잡이 끝나면 사라지므로 시크릿이 아니다 — 운영 DB 계정과 무관하다.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: computer_price
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: price_app
      MYSQL_PASSWORD: ci_app_pw
      MYSQL_DATABASE: computer_price

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 의존성 설치
        run: pip install -e ".[dev]"

      - name: MySQL 클라이언트 확인
        run: mysql --version || (sudo apt-get update && sudo apt-get install -y mysql-client)

      - name: price_app 계정 생성
        # 앱은 root 로 접속하지 않는다(CLAUDE.md 규칙). 운영과 같은 계정명으로 맞춘다.
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci_root_pw <<'SQL'
          CREATE USER IF NOT EXISTS 'price_app'@'%' IDENTIFIED BY 'ci_app_pw';
          GRANT ALL PRIVILEGES ON `computer_price`.* TO 'price_app'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: 스키마 적용
        run: |
          for f in mysql/ddl/schema.sql mysql/ddl/users.sql mysql/ddl/user_watchlist.sql; do
            echo "applying $f"
            mysql -h 127.0.0.1 -P 3306 -u price_app -pci_app_pw computer_price < "$f"
          done

      - name: 스키마 적용 확인
        run: |
          mysql -h 127.0.0.1 -P 3306 -u price_app -pci_app_pw computer_price \
            -e "SHOW FULL TABLES;"

      - name: 통합 테스트 실행
        run: python -m pytest tests/integration/ -v -o "addopts=" -m integration
