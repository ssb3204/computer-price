name: CI 테스트

# 클라우드 러너(GitHub Actions)에서 돌릴 수 있는 검증만 수행한다.
# - 유닛 테스트: get_connection 을 mock 으로 교체해 실제 DB 없이 실행 가능
# - 린트: ruff 로 코드 스타일/오류 정적 검사
#
# 통합 테스트(tests/integration/)는 실제 로컬 MySQL 접속이 필요해서
# 클라우드 러너에서 돌릴 수 없다. 로컬에서 아래 명령으로 직접 실행한다:
#     python -m pytest tests/integration/ -m integration
# (자세한 안내는 README 참고)

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  lint:
    name: 린트 (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 의존성 설치
        run: pip install -e ".[dev]"
      - name: ruff 검사
        run: python -m ruff check .

  unit-tests:
    name: 유닛 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 의존성 설치
        run: pip install -e ".[dev]"
      - name: 유닛 테스트 실행
        run: python -m pytest tests/unit/ -v -o "addopts="
